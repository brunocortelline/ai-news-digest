altech.com.br/podcast/podcast-canaltech/racismo-algoritmico-como-a-ia-pode-reforcar-preconceitos-6723/", "fonte": "Canaltech", "categoria": "Brasil", "data": "17/09/2026", "cor": "#B0805A", "selo_bg": "#F7EEE7", "selo_texto": "#6B4A2E"}, {"titulo": "Claude Code transforma projetos em conversas autônomas", "resumo": "A Anthropic lançou uma nova versão dos projetos no Claude Code, permitindo que o usuário apenas descreva uma meta e o Claude coordene múltiplas tarefas em paralelo, incluindo delegação, testes e criação de PRs. A funcionalidade está em beta para assinantes selecionados do Claude Pro e Max que usam sessões em nuvem.", "por_que_importa": "Automatizar a coordenação de tarefas complexas de desenvolvimento reduz drasticamente o esforço manual de gestão de projetos, apontando para um futuro onde IA atua como gerente técnico autônomo em fluxos de engenharia de software.", "link": "https://claude.com/blog/projects-redesigned", "fonte": "Anthropic News (comunidade)", "categoria": "Labs & Modelos", "data": "17/09/2026", "cor": "#E08D2D", "selo_bg": "#FDEEDC", "selo_texto": "#8A4B12"}, {"titulo": "Como a Balyasny avalia e governa o Claude na gestão de ativos", "resumo": "A gestora de investimentos Balyasny Asset Management, com US$ 38 bilhões sob gestão, detalhou como testa novos modelos de IA em milhares de tarefas financeiras reais e por que criou sua própria plataforma de agentes. O Chief AI Officer da firma explica as mudanças trazidas pelo Claude Fable 5, destacando a evolução de sistemas de busca para sistemas capazes de executar trabalho completo, como análises de fusões e aquisições.", "por_que_importa": "Mostra um caso concreto de maturidade em IA agentiva no setor financeiro, sinalizando que empresas de TI podem replicar esse modelo de avaliação rigorosa e governança para acelerar adoção segura de agentes em processos críticos de negócio.", "link": "https://claude.com/blog/working-at-the-frontier-how-balyasny-asset-management-evaluates-and-governs-claude-fable-5", "fonte": "Anthropic News (comunidade)", "categoria": "Labs & Modelos", "data": "17/09/2026", "cor": "#E08D2D", "selo_bg": "#FDEEDC", "selo_texto": "#8A4B12"}, {"titulo": "IA enfrenta novo desafio: os materiais por trás do hardware", "resumo": "O boom da IA está expondo limites físicos em semicondutores e data centers, relacionados a desempenho, gestão térmica, eficiência elétrica e confiabilidade. Isso está tornando os materiais de infraestrutura tão estratégicos quanto os próprios algoritmos de IA.", "por_que_importa": "Empresas de tecnologia precisarão acompanhar inovações em materiais e infraestrutura física, não só em software, para sustentar a escalada de produtos baseados em IA.", "link": "https://www.technologyreview.com/2026/09/16/1144014/building-the-materials-foundation-for-ai/", "fonte": "MIT Technology Review - AI", "categoria": "Pesquisa & Tendências", "data": "16/09/2026", "cor": "#7F77DD", "selo_bg": "#EDEAFB", "selo_texto": "#3C3489"}, {"titulo": "Google reúne iniciativas de IA com impacto social", "resumo": "O Google AI Blog lançou uma coletânea mostrando como especialistas e lideranças locais estão aplicando avanços de IA para ampliar o acesso a essa tecnologia. O foco está em projetos que buscam democratizar oportunidades geradas pela inteligência artificial em diferentes comunidades.", "por_que_importa": "Mostra tendências de uso responsável e inclusivo de IA que podem inspirar parcerias e projetos de impacto social alinhados à estratégia de ESG e inovação da empresa.", "link": "https://blog.google/innovation-and-ai/technology/ai/ai-for-societal-impact/", "fonte": "Google AI Blog", "categoria": "Labs & Modelos", "data": "15/09/2026", "cor": "#E08D2D", "selo_bg": "#FDEEDC", "selo_texto": "#8A4B12"}, {"titulo": "Google mostra como sua IA acelera ciência e melhora vidas", "resumo": "O material é um vídeo institucional do Google AI destacando aplicações de inteligência artificial em diferentes contextos, como educação e saúde. A peça reforça o posicionamento da empresa no uso de IA para acelerar descobertas científicas e gerar impacto social.", "por_que_importa": "Sinaliza para onde grandes players estão direcionando investimento e narrativa em IA, útil para orientar parcerias e casos de uso em setores como educação e saúde.", "link": "https://blog.google/innovation-and-ai/technology/ai/ai-applications-science-people/", "fonte": "Google AI Blog", "categoria": "Labs & Modelos", "data": "15/09/2026", "cor": "#E08D2D", "selo_bg": "#FDEEDC", "selo_texto": "#8A4B12"}, {"titulo": "Claude for Small Business ganha novos workflows e integrações", "resumo": "A Anthropic expandiu o Claude for Small Business com 43 workflows e 27 novas integrações, incluindo Shopify, Salesforce, Stripe e Zapier. A ferramenta, lançada em maio e já instalada mais de 900 mil vezes, agora vai além da gestão administrativa para apoiar o crescimento do negócio, com foco em geração de leads e propostas comerciais.", "por_que_importa": "Mostra como a IA está se tornando infraestrutura essencial para pequenas empresas, abrindo espaço para parcerias e integrações estratégicas com ecossistemas de software populares no mercado.", "link": "https://claude.com/blog/claude-for-small-business-launches-new-workflows-integrations-and-training-programs", "fonte": "Anthropic News (comunidade)", "categoria": "Labs & Modelos", "data": "15/09/2026", "cor": "#E08D2D", "selo_bg": "#FDEEDC", "selo_texto": "#8A4B12"}]</script>
  <script>
    const artigos = JSON.parse(document.getElementById('dados-artigos').textContent);
    const categorias = [{"nome": "Brasil", "cor": "#B0805A"}, {"nome": "Mercado & Negócios", "cor": "#1D9E75"}, {"nome": "Labs & Modelos", "cor": "#E08D2D"}, {"nome": "Pesquisa & Tendências", "cor": "#7F77DD"}];
    const CHAVE_FAVORITOS = 'ai-digest-favoritos-boletimdeia';

    let favoritos = new Set(JSON.parse(localStorage.getItem(CHAVE_FAVORITOS) || '[]'));
    let categoriaAtiva = 'todas';
    let somenteFavoritos = false;
    let termoBusca = '';

    function salvarFavoritos() {
      localStorage.setItem(CHAVE_FAVORITOS, JSON.stringify([...favoritos]));
    }

    function escaparHtml(texto) {
      const div = document.createElement('div');
      div.textContent = texto || '';
      return div.innerHTML;
    }

    function normalizar(texto) {
      return (texto || '').toLowerCase();
    }

    function artigosFiltrados() {
      return artigos.filter(a => {
        if (somenteFavoritos && !favoritos.has(a.link)) return false;
        if (categoriaAtiva !== 'todas' && a.categoria !== categoriaAtiva) return false;
        if (termoBusca) {
          const texto = normalizar(a.titulo + ' ' + a.resumo + ' ' + a.fonte);
          if (!texto.includes(normalizar(termoBusca))) return false;
        }
        return true;
      });
    }

    function renderizarFiltros() {
      const container = document.getElementById('filtros');
      let html = '<span class="chip todas-chip" data-cat="todas">todas</span>';
      categorias.forEach(cat => {
        html += `<span class="chip" data-cat="${escaparHtml(cat.nome)}"><span class="ponto" style="background:${cat.cor}"></span>${escaparHtml(cat.nome)}</span>`;
      });
      html += '<span class="chip favoritos-chip" data-cat="__favoritos__">&#9733; favoritos</span>';
      container.innerHTML = html;

      container.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const cat = chip.dataset.cat;
          if (cat === '__favoritos__') {
            somenteFavoritos = !somenteFavoritos;
          } else {
            categoriaAtiva = cat;
          }
          atualizarEstadoChips();
          renderizarLista();
        });
      });
      atualizarEstadoChips();
    }

    function atualizarEstadoChips() {
      document.querySelectorAll('.chip').forEach(chip => {
        const cat = chip.dataset.cat;
        if (cat === '__favoritos__') {
          chip.classList.toggle('ativo', somenteFavoritos);
        } else {
          chip.classList.toggle('ativo', cat === categoriaAtiva);
        }
      });
    }

    function cardHtml(a) {
      const ehFavorito = favoritos.has(a.link);
      const porQue = a.por_que_importa
        ? `<p class="por-que"><strong>Por que importa:</strong> ${escaparHtml(a.por_que_importa)}</p>`
        : '';
      return `
      <article class="card" style="--card-cor:${a.cor}">
        <div class="card-topo">
          <div class="card-meta">
            <span class="selo" style="background:${a.selo_bg};color:${a.selo_texto}">${escaparHtml(a.categoria)}</span>
            <span>${escaparHtml(a.fonte)}</span>
            ${a.data ? `<span>${a.data}</span>` : ''}
          </div>
          <button class="favorito-btn ${ehFavorito ? 'ativo' : ''}" data-link="${escaparHtml(a.link)}" aria-label="Favoritar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="${ehFavorito ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </button>
        </div>
        <h3>${a.link && a.link.startsWith('http') ? `<a href="${escaparHtml(a.link)}" target="_blank" rel="noopener">${escaparHtml(a.titulo)}</a>` : escaparHtml(a.titulo)}</h3>
        <p class="resumo">${escaparHtml(a.resumo)}</p>
        ${porQue}
      </article>
      `;
    }

    function renderizarLista() {
      const lista = artigosFiltrados();
      const container = document.getElementById('lista-artigos');
      const contador = document.getElementById('contador');

      contador.textContent = lista.length + (lista.length === 1 ? ' notícia exibida' : ' notícias exibidas');

      if (lista.length === 0) {
        container.innerHTML = `
          <div class="vazio">
            <p><strong>Nenhum sinal encontrado com esses filtros.</strong></p>
            <p>Tente limpar a busca ou escolher outra categoria.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = lista.map(cardHtml).join('');

      container.querySelectorAll('.favorito-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const link = btn.dataset.link;
          if (favoritos.has(link)) {
            favoritos.delete(link);
          } else {
            favoritos.add(link);
          }
          salvarFavoritos();
          renderizarLista();
        });
      });
    }

    document.getElementById('campo-busca').addEventListener('input', (e) => {
      termoBusca = e.target.value;
      renderizarLista();
    });

    renderizarFiltros();
    renderizarLista();
  </script>
</body>
</html>
