r o OriginOS 7, baseado no Android 17, para a linha X300 no Brasil. A atualização traz maior integração entre dispositivos e um assistente de IA próprio da marca, batizado de Jovi.", "por_que_importa": "Fabricantes investindo em assistentes de IA proprietários e ecossistemas integrados aumentam a pressão competitiva sobre players de software e serviços que dependem de camadas abertas do Android.", "link": "https://tecnoblog.net/noticias/android-17-jovi-comeca-a-liberar-originos-7-no-brasil/", "fonte": "Tecnoblog", "categoria": "Brasil", "data": "29/10/2026", "cor": "#B0805A", "selo_bg": "#F7EEE7", "selo_texto": "#6B4A2E"}, {"titulo": "Gemini ganha edição nativa de PDFs e documentos", "resumo": "O Google atualizou o Gemini para permitir a edição de arquivos diretamente em sua interface, sem precisar de outros aplicativos. O recurso cobre PDFs, documentos de texto, planilhas e trechos de código.", "por_que_importa": "A edição integrada reduz a necessidade de alternar entre ferramentas, reforçando a disputa do Gemini com Copilot e ChatGPT por produtividade corporativa.", "link": "https://tecnoblog.net/noticias/gemini-agora-permite-editar-pdfs-e-documentos-em-sua-propria-interface/", "fonte": "Tecnoblog", "categoria": "Brasil", "data": "29/10/2026", "cor": "#B0805A", "selo_bg": "#F7EEE7", "selo_texto": "#6B4A2E"}, {"titulo": "OpenAI atualiza diretrizes de comportamento para modelos de IA", "resumo": "A OpenAI revisou seu Model Spec, documento que define como seus modelos de IA devem se comportar, estabelecendo cinco valores centrais. O foco está em promover julgamento sólido, preservar a autonomia humana e garantir fidelidade às intenções dos usuários.", "por_que_importa": "Define o padrão de governança e segurança que moldará o comportamento de IAs cada vez mais capazes, impactando diretamente como empresas podem confiar e integrar esses modelos em produtos críticos.", "link": "https://openai.com/index/updated-model-spec", "fonte": "OpenAI News", "categoria": "Labs & Modelos", "data": "29/10/2026", "cor": "#E08D2D", "selo_bg": "#FDEEDC", "selo_texto": "#8A4B12"}]</script>
  <script>
    const artigos = JSON.parse(document.getElementById('dados-artigos').textContent);
    const categorias = [{"nome": "Brasil", "cor": "#B0805A"}, {"nome": "Mercado & Negócios", "cor": "#1D9E75"}, {"nome": "Labs & Modelos", "cor": "#E08D2D"}, {"nome": "Pesquisa & Tendências", "cor": "#7F77DD"}];
    const CHAVE_FAVORITOS = 'ai-digest-favoritos-boletimdeia';

    let favoritos = new Set(JSON.parse(localStorage.getItem(CHAVE_FAVORITOS) || '[]'));
    let categoriaAtiva = 'todas';
    let somenteFavoritos = false;
    let termoBusca = '';

    function salvarFavoritos() {
      localStorage.setItem(CHAVE_FAVORITOS, JSON.stringify([...favoritos]));
    }

    function escaparHtml(texto) {
      const div = document.createElement('div');
      div.textContent = texto || '';
      return div.innerHTML;
    }

    function normalizar(texto) {
      return (texto || '').toLowerCase();
    }

    function artigosFiltrados() {
      return artigos.filter(a => {
        if (somenteFavoritos && !favoritos.has(a.link)) return false;
        if (categoriaAtiva !== 'todas' && a.categoria !== categoriaAtiva) return false;
        if (termoBusca) {
          const texto = normalizar(a.titulo + ' ' + a.resumo + ' ' + a.fonte);
          if (!texto.includes(normalizar(termoBusca))) return false;
        }
        return true;
      });
    }

    function renderizarFiltros() {
      const container = document.getElementById('filtros');
      let html = '<span class="chip todas-chip" data-cat="todas">todas</span>';
      categorias.forEach(cat => {
        html += `<span class="chip" data-cat="${escaparHtml(cat.nome)}"><span class="ponto" style="background:${cat.cor}"></span>${escaparHtml(cat.nome)}</span>`;
      });
      html += '<span class="chip favoritos-chip" data-cat="__favoritos__">&#9733; favoritos</span>';
      container.innerHTML = html;

      container.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const cat = chip.dataset.cat;
          if (cat === '__favoritos__') {
            somenteFavoritos = !somenteFavoritos;
          } else {
            categoriaAtiva = cat;
          }
          atualizarEstadoChips();
          renderizarLista();
        });
      });
      atualizarEstadoChips();
    }

    function atualizarEstadoChips() {
      document.querySelectorAll('.chip').forEach(chip => {
        const cat = chip.dataset.cat;
        if (cat === '__favoritos__') {
          chip.classList.toggle('ativo', somenteFavoritos);
        } else {
          chip.classList.toggle('ativo', cat === categoriaAtiva);
        }
      });
    }

    function cardHtml(a) {
      const ehFavorito = favoritos.has(a.link);
      const porQue = a.por_que_importa
        ? `<p class="por-que"><strong>Por que importa:</strong> ${escaparHtml(a.por_que_importa)}</p>`
        : '';
      return `
      <article class="card" style="--card-cor:${a.cor}">
        <div class="card-topo">
          <div class="card-meta">
            <span class="selo" style="background:${a.selo_bg};color:${a.selo_texto}">${escaparHtml(a.categoria)}</span>
            <span>${escaparHtml(a.fonte)}</span>
            ${a.data ? `<span>${a.data}</span>` : ''}
          </div>
          <button class="favorito-btn ${ehFavorito ? 'ativo' : ''}" data-link="${escaparHtml(a.link)}" aria-label="Favoritar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="${ehFavorito ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </button>
        </div>
        <h3>${a.link && a.link.startsWith('http') ? `<a href="${escaparHtml(a.link)}" target="_blank" rel="noopener">${escaparHtml(a.titulo)}</a>` : escaparHtml(a.titulo)}</h3>
        <p class="resumo">${escaparHtml(a.resumo)}</p>
        ${porQue}
      </article>
      `;
    }

    function renderizarLista() {
      const lista = artigosFiltrados();
      const container = document.getElementById('lista-artigos');
      const contador = document.getElementById('contador');

      contador.textContent = lista.length + (lista.length === 1 ? ' notícia exibida' : ' notícias exibidas');

      if (lista.length === 0) {
        container.innerHTML = `
          <div class="vazio">
            <p><strong>Nenhum sinal encontrado com esses filtros.</strong></p>
            <p>Tente limpar a busca ou escolher outra categoria.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = lista.map(cardHtml).join('');

      container.querySelectorAll('.favorito-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const link = btn.dataset.link;
          if (favoritos.has(link)) {
            favoritos.delete(link);
          } else {
            favoritos.add(link);
          }
          salvarFavoritos();
          renderizarLista();
        });
      });
    }

    document.getElementById('campo-busca').addEventListener('input', (e) => {
      termoBusca = e.target.value;
      renderizarLista();
    });

    renderizarFiltros();
    renderizarLista();
  </script>
</body>
</html>
