# Fontes de notícias sobre IA (boletim geral: modelos, mercado, comunidade dev).
# Adicione/remova feeds aqui sem precisar tocar em código.
# 'categoria' é usada para agrupar/colorir no dashboard final.

feeds:
  - nome: "OpenAI News"
    url: "https://openai.com/news/rss.xml"
    categoria: "Labs & Modelos"

  - nome: "Anthropic News (comunidade)"
    url: "https://tim-hilde.github.io/anthropic-rss/rss.xml"
    categoria: "Labs & Modelos"
    # Nota: a Anthropic não publica um RSS oficial. Este é um feed mantido
    # pela comunidade que espelha o blog oficial diariamente. Se um dia parar
    # de funcionar, é só remover este item (ou trocar por outro feed).

  - nome: "Google AI Blog"
    url: "https://blog.google/technology/ai/rss/"
    categoria: "Labs & Modelos"

  - nome: "TechCrunch AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    categoria: "Mercado & Negócios"

  - nome: "VentureBeat"
    url: "https://venturebeat.com/feed/"
    categoria: "Mercado & Negócios"
    # Nota: a VentureBeat reposicionou o site inteiro para cobrir principalmente
    # IA/dados/segurança, então o feed geral já vem bem focado nisso.

  - nome: "MIT Technology Review - AI"
    url: "https://www.technologyreview.com/topic/artificial-intelligence/feed/"
    categoria: "Pesquisa & Tendências"

  - nome: "The Verge - AI"
    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
    categoria: "Mercado & Negócios"

  - nome: "Hacker News (AI, via HN RSS)"
    url: "https://hnrss.org/newest?q=AI+OR+LLM+OR+%22artificial+intelligence%22"
    categoria: "Comunidade & Devs"

  - nome: "Canaltech"
    url: "https://feeds2.feedburner.com/canaltechbr"
    categoria: "Brasil"
    # Feed geral do Canaltech (todas as editorias) — o filtro de palavras-chave
    # abaixo já cuida de selecionar só o que for relevante sobre IA.

  - nome: "Tecnoblog"
    url: "https://tecnoblog.net/feed"
    categoria: "Brasil"

# Palavras-chave usadas para filtrar itens relevantes de feeds mais genéricos
palavras_chave:
  - "AI"
  - "IA"
  - "artificial intelligence"
  - "inteligência artificial"
  - "LLM"
  - "modelo de linguagem"
  - "machine learning"
  - "GPT"
  - "Claude"
  - "Gemini"
  - "agentic"
  - "agente de IA"

# Quantos dias para trás considerar na busca semanal
janela_dias: 7

# Máximo de notícias no resumo final (evita boletins gigantes)
max_noticias: 25

# Máximo de notícias vindas de uma mesma fonte (evita que uma fonte de alto
# volume, como Hacker News ou TechCrunch, ocupe todas as vagas sozinha)
max_por_fonte: 3

# Quando uma fonte tem mais notícias do que "max_por_fonte" permite, estas
# palavras-chave decidem quais entram: notícias que mencionam mais desses
# termos (temas de desenvolvimento com IA) têm prioridade sobre as demais,
# mesmo que não sejam as mais recentes daquela fonte.
palavras_chave_prioridade:
  - "developer"
  - "desenvolvedor"
  - "SDK"
  - "API"
  - "framework"
  - "coding agent"
  - "agente de codificação"
  - "open source"
  - "código aberto"
  - "engineering"
  - "engenharia"
  - "build"
  - "integration"
  - "integração"
  - "code generation"
  - "geração de código"
  - "programming"
  - "programação"
  - "IDE"
  - "copilot"
  - "software development"
  - "desenvolvimento de software"
  - "Brasil"
  - "Brazil"
  - "brasileira"
  - "brasileiro"
