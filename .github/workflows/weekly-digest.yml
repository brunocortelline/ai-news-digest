name: Boletim Semanal de IA

on:
  schedule:
    # Toda segunda-feira às 09:00 (horário de Brasília = 12:00 UTC)
    - cron: "0 12 * * 1"
  workflow_dispatch: {}  # permite rodar manualmente pela aba "Actions" no GitHub

permissions:
  contents: write

jobs:
  gerar-boletim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/main.py

      - name: Publicar mudanças no repositório
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Boletim semanal de IA - $(date +'%Y-%m-%d')"
          git push
